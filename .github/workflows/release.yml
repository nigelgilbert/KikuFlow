# A pushed tag like v0.2.0 builds the app, signs it with the release certificate and publishes
# KikuFlow.zip, which install.sh downloads. docs/releasing.md has the one-time setup.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test
        run: app/test.sh
      - name: Import the signing certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" >/dev/null
          # codesign finds a certificate only in a keychain on the search list.
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: Build
        run: KIKU_VERSION="${GITHUB_REF_NAME#v}" app/bundle.sh
      - name: Check the signature
        # bundle.sh falls back to an ad-hoc signature, and a release signed that way would cost
        # every user their Accessibility grant.
        run: |
          codesign --verify --deep --strict "app/build/Kiku Flow.app"
          codesign -d -r- "app/build/Kiku Flow.app" 2>&1 | grep 'certificate leaf'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent "app/build/Kiku Flow.app" KikuFlow.zip
          gh release create "$GITHUB_REF_NAME" KikuFlow.zip --generate-notes
