[project]
name = "kiku-sidecar"
version = "0.1.0"
description = "Local transcription and cleanup server for Kiku Flow"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "mlx-lm",
    "mlx-whisper",
    "numpy",
    "parakeet-mlx",
    "uvicorn",
]

[project.scripts]
kiku-sidecar = "kiku_sidecar.server:main"

[dependency-groups]
dev = ["httpx", "pyright", "pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
# The examples too, so they are checked against `Plugin`.
include = ["src", "tests", "../examples"]
venvPath = "."
venv = ".venv"
